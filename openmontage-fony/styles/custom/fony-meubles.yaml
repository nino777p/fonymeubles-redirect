identity:
  name: "Fony Meubles"
  category: minimalist
  mood: calm, warm, premium, trustworthy
  pace: deliberate
  best_for: "Furniture product videos (Reels, ads, website) built from the real product photos"

taste_profile:
  design_read: "Premium furniture catalogue brought to life: quiet confidence, real materials, no gimmicks."
  visual_variance: 3
  motion_intensity: 2
  information_density: 2
  palette_discipline: "Warm off-white field, deep warm charcoal text, natural wood and linen tones from the photos only."
  layout_variation: "Alternate full-bleed product shots with gallery frames (whole photo on off-white with soft shadow)."
  reference_strategy: "Use ONLY the client's product photos. Never generate or edit product imagery."
  anti_patterns:
    - "cartoon, cute, childish or meme aesthetics"
    - "neon, glitter, rainbow, glitch, vaporwave, flashy gradients"
    - "fast zooms, whip pans, bounce, shake, spin or flashy transitions"
    - "AI-generated or AI-edited product imagery (the furniture must stay exactly as photographed)"
    - "emoji, stickers, word-by-word captions, loud sound effects"
  quality_gates:
    - "The furniture in every frame is pixel-identical to the supplied photo (only scale and position change)."
    - "Every shot holds 2.5-5 s with one slow, eased camera move."
    - "Final frame is the brand end card, never a grey or black dead frame."

visual_language:
  color_palette:
    primary: ["#28241F", "#4A433B"]
    accent: ["#8C6A4A"]
    background: "#F5F2ED"
    text: "#28241F"
    muted: "#786F66"
  composition: one product per frame, centered or rule-of-thirds, generous margins, horizon level
  texture: real photographic texture only; flat matte off-white fields for cards; no added grain or filters

typography:
  headings:
    font: "Didot"
    weight: 400
    tracking: "0.02em"
  body:
    font: "Helvetica Neue"
    weight: 400
    line_height: 1.5

motion:
  transitions: [fade, dissolve]
  animation_style: "slow eased push-in, pull-out or gentle drift; cosine ease; never bounce"
  pacing_rules:
    min_scene_hold_seconds: 2.5
    max_scene_hold_seconds: 5.5
    text_card_hold_seconds: 3.5
    transition_duration_seconds: 0.8
  entrance: "fade from black over 0.6 s on the first shot only"
  exit: "dissolve into the off-white end card; text fades in"

audio:
  voice_style: "none by default (music only); if requested: calm, warm, French, low hype"
  music_mood: "soft acoustic or minimal piano, warm, unhurried, 70-95 BPM, royalty-free with commercial licence"
  music_volume: 0.8
  sfx_style: "none"
  ducking_threshold_db: -6

asset_generation:
  image_prompt_prefix: "DO NOT GENERATE PRODUCT IMAGERY. Use the client's photos via fony_photo_motion. "
  image_negative_prompt: "cartoon, cute, neon, glitter, fantasy, cluttered, distorted furniture, extra legs, warped fabric"
  consistency_anchors:
    - "Off-white #F5F2ED background on cards and gallery frames"
    - "Deep warm charcoal #28241F typography"
    - "Only real product photos, never altered"
    - "Slow eased camera, dissolves only"

quality_rules:
  - "Minimum contrast ratio 4.5:1 for all text"
  - "One product per frame"
  - "No on-screen text except the end card (brand + website) unless the client supplies copy"
  - "No claims (price, materials, dimensions) that the client did not provide"
